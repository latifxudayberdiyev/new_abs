spring:
  application:
    name: pechat-service
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/file_service
    username: postgres
    password: Ogabek2006
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 4
      idle-timeout: 60000
      max-lifetime: 1200000
      connection-timeout: 5000
